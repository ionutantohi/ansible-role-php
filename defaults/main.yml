php_version: 8.5
php_default_extensions:
  - fpm
  - cli
  - mysql
  - sqlite3
  - curl
  - mbstring
  - soap
  - zip
  - bcmath
  - xml
  - intl
  - gd
  - imagick
  - redis
php_extra_extensions: []
php_pool_name: www
php_pool_user: www-data
php_pool_max_children: 5
php_pool_start_servers: 2
php_pool_min_spare_servers: 1
php_pool_max_spare_servers: 3
php_pool_slowlog_timeout: 30
php_ini_post_max_size: 20M
php_ini_upload_max_filesize: 20M
